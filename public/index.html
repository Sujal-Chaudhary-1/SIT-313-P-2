<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DEV@Deakin</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="navbar">
    <h1>DEV<span>@Deakin</span></h1>
    <p class="tagline">A community for Deakin developers to learn, share and grow.</p>
  </header>

  <main>
    <section class="hero">
      <h2>Stay in the loop</h2>
      <p>Sign up to get the latest articles, tips and updates from DEV@Deakin straight to your inbox.</p>

      <form id="signup-form" class="signup-form">
        <input
          type="email"
          id="email"
          name="email"
          placeholder="you@deakin.edu.au"
          required
        />
        <button type="submit">Subscribe</button>
      </form>

      <p id="form-message" class="form-message"></p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 DEV@Deakin. SIT313 Task P2.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
